# Production secrets must be injected by Cloud Run / Secret Manager.
jwt.secret=${JWT_SECRET}
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.issuer=${JWT_ISSUER:bachatgat-api}
payment.hmac-secret=${PAYMENT_HMAC_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.firebase.auth.enabled=${FIREBASE_AUTH_ENABLED:false}

logging.level.com.bachatgat=INFO
logging.level.org.springframework.security=WARN
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Compress HTML, CSS, JavaScript, JSON, and other text responses before they
# travel to mobile devices. This reduces transfer time without changing data.
server.compression.enabled=true
server.compression.mime-types=text/html,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

gcp.firestore.database=(default)
gcp.firestore.emulator.enabled=true
gcp.firestore.emulator.host=${FIRESTORE_EMULATOR_HOST:127.0.0.1:8081}
gcp.storage.bucket=bachatgat-test-documents
app.demo-data.enabled=true
jwt.secret=test-only-jwt-secret-change-me-2026
payment.hmac-secret=test-only-payment-hmac-secret
logging.level.com.bachatgat=WARN

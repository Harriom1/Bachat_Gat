<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Group Report - Bachat Gat</title>
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/tables.css"><link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head><body><div class="app-wrapper">
  <aside class="app-sidebar"><div class="sidebar-header"><div class="brand-icon">₹</div><div><div class="brand-title" data-i18n="appName">Bachat Gat</div><span class="brand-badge">MEMBER</span></div></div>
    <ul class="sidebar-menu"><li class="menu-category">MY ACCOUNT</li><li><a href="/user/dashboard.html" class="menu-item"><i class="bi bi-grid-1x2-fill menu-icon"></i><span data-i18n="dashboard">Dashboard</span></a></li><li><a href="/user/collections.html" class="menu-item"><i class="bi bi-wallet2 menu-icon"></i><span data-i18n="collections">Collections</span></a></li><li><a href="/user/reports.html" class="menu-item active"><i class="bi bi-bar-chart-fill menu-icon"></i><span data-i18n="reports">Reports</span></a></li><li><a href="/user/settings.html" class="menu-item"><i class="bi bi-gear-fill menu-icon"></i><span data-i18n="settings">Settings</span></a></li></ul>
    <div class="sidebar-footer"><a href="#" class="menu-item btn-logout"><i class="bi bi-box-arrow-left menu-icon"></i><span data-i18n="logout">Logout</span></a></div>
  </aside>
  <main class="app-main"><header class="app-topbar"><div class="topbar-left"><button id="sidebar-toggle" class="menu-toggle"><i class="bi bi-list"></i></button><span data-i18n="reports">My Group Report</span></div><div class="topbar-right"><select class="lang-selector form-select"><option value="en">English</option><option value="mr">मराठी</option><option value="hi">हिन्दी</option></select></div></header>
      <div class="page-content"><div class="page-header"><div><h1 class="page-title" data-i18n="reports">My Group Report</h1><p class="page-subtitle">Read-only monthly financial information for your Bachat Gat</p></div><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button id="print-report" class="btn-outline-custom"><i class="bi bi-printer"></i> Print / PDF</button><button id="download-report" class="btn-outline-custom"><i class="bi bi-download"></i> Download CSV</button></div></div>
      <div class="content-card" style="margin-bottom:1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap"><select id="report-month" class="form-select" style="max-width:150px"></select><select id="report-year" class="form-select" style="max-width:120px"></select><button id="load-report" class="btn-primary-custom"><i class="bi bi-filter"></i> Load Report</button></div>
      <div class="content-card"><h2 id="report-title" data-i18n="myGroupReport">My Group Report</h2><div class="table-responsive"><table class="data-table mobile-card-table"><thead><tr><th data-i18n="financialItem">Financial Item</th><th style="text-align:right" data-i18n="amount">Amount</th></tr></thead><tbody id="summary"></tbody></table></div></div>
      <div class="content-card" style="margin-top:1rem"><h2 data-i18n="monthlyCollections">Monthly Collections</h2><div class="table-responsive"><table class="data-table mobile-card-table"><thead><tr><th>Member</th><th>Expected</th><th>Paid</th><th>Pending</th><th>Status</th></tr></thead><tbody id="collections"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div>
    </div></main></div>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/common.js"></script><script src="/js/i18n.js"></script>
  <script>
    const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];
    function esc(v){return Common.text ? Common.text(v) : String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    let currentReport=null;
    async function load(){const m=+document.getElementById('report-month').value,y=+document.getElementById('report-year').value;try{const d=await api.getMyMonthlyReport(m,y);currentReport=d;document.getElementById('report-title').textContent=`${months[m]} ${y} - ${d.group?.name||'Bachat Gat'}`;const rows=[['Total Expected Monthly Bachat',d.totalExpected],['Monthly Bachat Collected',d.totalCollected],['Monthly Bachat Pending',d.totalPending],['Monthly Bachat Penalty',d.totalMonthlyBachatPenalty],['Opening Fund',d.openingFund],['Remaining Fund',d.remainingFund],['Loan Principal Recovered',d.loanPrincipalRecovered],['Loan Interest Income',d.loanInterestIncome],['Loan Disbursement',d.loanDisbursement],['Monthly Expenses',d.monthlyExpenses]];document.getElementById('summary').innerHTML=rows.map(r=>`<tr><td data-label="Financial Item">${esc(r[0])}</td><td data-label="Amount" style="text-align:right;font-weight:700">${Common.formatIndianCurrency(r[1]||0)}</td></tr>`).join('');document.getElementById('collections').innerHTML=(d.collections||[]).map(c=>`<tr><td data-label="Member">${esc(c.memberName||c.memberId)}</td><td data-label="Expected">${Common.formatIndianCurrency(c.expectedAmount||0)}</td><td data-label="Paid">${Common.formatIndianCurrency(c.paidAmount||0)}</td><td data-label="Pending">${Common.formatIndianCurrency(c.pendingAmount||0)}</td><td data-label="Status">${esc(c.status||'')}</td></tr>`).join('')||'<tr><td colspan="5">No collections recorded.</td></tr>';}catch(e){document.getElementById('summary').innerHTML=`<tr><td colspan="2" style="color:var(--danger)">Unable to load this report. Please restart the application and sign in again.</td></tr>`;Common.showToast('Unable to load report: '+e.message,'danger')}}
    function download(){if(!currentReport)return;const rows=[['Financial Item','Amount'],['Total Expected Monthly Bachat',currentReport.totalExpected],['Monthly Bachat Collected',currentReport.totalCollected],['Monthly Bachat Pending',currentReport.totalPending],['Monthly Bachat Penalty',currentReport.totalMonthlyBachatPenalty],['Opening Fund',currentReport.openingFund],['Remaining Fund',currentReport.remainingFund],['Loan Principal Recovered',currentReport.loanPrincipalRecovered],['Loan Interest Income',currentReport.loanInterestIncome],['Loan Disbursement',currentReport.loanDisbursement],['Monthly Expenses',currentReport.monthlyExpenses]];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`monthly-report-${currentReport.month}-${currentReport.year}.csv`;a.click();}
    document.addEventListener('DOMContentLoaded',()=>{Auth.requireUser();const now=new Date();document.getElementById('report-month').innerHTML=months.slice(1).map((x,i)=>`<option value="${i+1}" ${i+1===now.getMonth()+1?'selected':''}>${x}</option>`).join('');document.getElementById('report-year').innerHTML=[now.getFullYear(),now.getFullYear()-1].map(y=>`<option>${y}</option>`).join('');document.getElementById('load-report').onclick=load;document.getElementById('download-report').onclick=download;document.getElementById('print-report').onclick=()=>window.print();load();});
  </script>
</body></html>

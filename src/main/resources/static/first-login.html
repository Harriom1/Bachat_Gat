<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Bachat Gat Management Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 1.5rem;
      min-height: 100vh;
    }
    .first-login-card {
      background: #ffffff;
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 480px;
      padding: 2.25rem;
      position: relative;
    }
    .first-login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .security-notice {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      color: #1e40af;
      font-size: 0.875rem;
    }
    .password-strength {
      height: 4px;
      border-radius: 2px;
      margin-top: 6px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s;
    }
  </style>
</head>
<body>
  <div class="first-login-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <span class="badge-status badge-paid" style="font-size: 0.75rem;"><i class="bi bi-shield-lock"></i> Security Requirement</span>
      <select class="lang-selector form-select" style="font-size: 0.8rem; width: auto;">
        <option value="en">English</option>
        <option value="mr">मराठी</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>

    <div class="first-login-brand">
      <div class="brand-icon">₹</div>
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-main);" data-i18n="appName">Bachat Gat Portal</h2>
        <p style="font-size: 0.75rem; color: var(--text-muted);" data-i18n="firstLoginNotice">First Login: Choose a New Password</p>
      </div>
    </div>

    <div class="security-notice">
      <i class="bi bi-info-circle-fill" style="font-size: 1.25rem; flex-shrink: 0; color: #2563eb;"></i>
      <div>
        <div style="font-weight: 700; margin-bottom: 0.2rem;" id="user-greeting">Welcome!</div>
        <div data-i18n="firstLoginNotice">For security purposes, you must change your temporary password before accessing the system.</div>
      </div>
    </div>

    <div id="first-login-alert" style="display: none; padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1rem;"></div>

    <form id="first-login-form">
      <div class="form-group">
        <label class="form-label" for="new-password" data-i18n="newPassword">New Password</label>
        <div style="position: relative;">
          <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autofocus>
          <button type="button" class="btn-toggle-pw" onclick="togglePw('new-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="password-strength">
          <div id="strength-bar" class="password-strength-bar"></div>
        </div>
        <small id="strength-text" style="font-size: 0.75rem; color: #64748b; margin-top: 4px; display: block;"></small>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password" data-i18n="confirmPassword">Confirm Password</label>
        <div style="position: relative;">
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter new password" required minlength="6">
          <button type="button" class="btn-toggle-pw" onclick="togglePw('confirm-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit-pw" class="btn-primary-custom" style="width: 100%; justify-content: center; padding: 0.7rem; margin-top: 1rem;">
        <i class="bi bi-check2-circle"></i> <span data-i18n="changePasswordBtn">Update Password & Continue</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.25rem;">
      <a href="#" class="btn-logout" style="font-size: 0.825rem; color: var(--text-muted); text-decoration: none;">
        <i class="bi bi-box-arrow-left"></i> <span data-i18n="logout">Logout</span>
      </a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Must be authenticated
      if (!Auth.isAuthenticated()) {
        window.location.href = '/login.html';
        return;
      }

      const user = Auth.getUser();
      if (user) {
        const greeting = document.getElementById('user-greeting');
        if (greeting) {
          greeting.textContent = `Welcome, ${user.fullName || user.username}!`;
        }
      }

      const newPwInput = document.getElementById('new-password');
      const confirmPwInput = document.getElementById('confirm-password');
      const strengthBar = document.getElementById('strength-bar');
      const strengthText = document.getElementById('strength-text');

      newPwInput.addEventListener('input', () => {
        const val = newPwInput.value;
        if (!val) {
          strengthBar.style.width = '0%';
          strengthText.textContent = '';
          return;
        }
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) || /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        if (score <= 1) {
          strengthBar.style.width = '25%';
          strengthBar.style.background = '#ef4444';
          strengthText.textContent = 'Weak';
          strengthText.style.color = '#ef4444';
        } else if (score === 2) {
          strengthBar.style.width = '50%';
          strengthBar.style.background = '#f59e0b';
          strengthText.textContent = 'Moderate';
          strengthText.style.color = '#f59e0b';
        } else if (score === 3) {
          strengthBar.style.width = '75%';
          strengthBar.style.background = '#3b82f6';
          strengthText.textContent = 'Good';
          strengthText.style.color = '#3b82f6';
        } else {
          strengthBar.style.width = '100%';
          strengthBar.style.background = '#10b981';
          strengthText.textContent = 'Strong';
          strengthText.style.color = '#10b981';
        }
      });

      const form = document.getElementById('first-login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = newPwInput.value;
        const p2 = confirmPwInput.value;

        if (p1.length < 6) {
          showAlert('Password must be at least 6 characters long.', 'danger');
          return;
        }

        if (p1 !== p2) {
          showAlert('Passwords do not match. Please re-enter carefully.', 'danger');
          return;
        }

        const btn = document.getElementById('btn-submit-pw');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving Password...';

        try {
          await api.firstLoginChangePassword(p1);

          // Update cached user object so firstLogin = false
          if (user) {
            user.firstLogin = false;
            Auth.setUser(user);
          }

          showAlert('Password changed successfully! Redirecting...', 'success');

          setTimeout(() => {
            if (user && user.role === 'SUPER_ADMIN') {
              window.location.href = '/admin/super-dashboard.html';
            } else if (user && (user.role === 'ADMIN' || user.role === 'PRESIDENT' || user.role === 'SECRETARY' || user.role === 'TREASURER')) {
              window.location.href = '/admin/dashboard.html';
            } else {
              window.location.href = '/user/dashboard.html';
            }
          }, 1200);
        } catch (err) {
          showAlert(err.message || 'Failed to update password. Please try again.', 'danger');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check2-circle"></i> Update Password & Continue';
        }
      });
    });

    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function showAlert(msg, type) {
      const alertBox = document.getElementById('first-login-alert');
      alertBox.style.display = 'block';
      alertBox.textContent = msg;
      if (type === 'danger') {
        alertBox.style.background = '#fef2f2';
        alertBox.style.color = '#ef4444';
        alertBox.style.border = '1px solid #fecaca';
      } else if (type === 'success') {
        alertBox.style.background = '#f0fdf4';
        alertBox.style.color = '#16a34a';
        alertBox.style.border = '1px solid #bbf7d0';
      } else {
        alertBox.style.background = '#fffbeb';
        alertBox.style.color = '#d97706';
        alertBox.style.border = '1px solid #fde68a';
      }
    }
  </script>
</body>
</html>

spring.profiles.active=prod

# Production secrets must be injected by Cloud Run / Secret Manager.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.issuer=${JWT_ISSUER:bachatgat-api}
payment.hmac-secret=${PAYMENT_HMAC_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.com.bachatgat=INFO
logging.level.org.springframework.security=WARN
management.endpoint.health.show-details=never

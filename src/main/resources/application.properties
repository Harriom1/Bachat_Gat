# ==============================================================
# BACHAT GAT / SHG MANAGEMENT PLATFORM - APPLICATION CONFIG
# ==============================================================

spring.application.name=bachatgat-shg-manager

# Cloud Run port and host binding
server.port=${PORT:8080}
server.address=0.0.0.0

# Active Spring Profile (dev / prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Demo data is allowed only in the development profile. Production must never
# clear or recreate financial records at startup.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}

# Jackson Date/Time serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Multipart file upload for member/loan documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Google Cloud Platform Configuration
gcp.project-id=${GCP_PROJECT_ID:bachat-gat-development}
gcp.firestore.database=${FIRESTORE_DATABASE:(default)}
gcp.firestore.emulator.enabled=${FIRESTORE_EMULATOR_ENABLED:false}
gcp.firestore.emulator.host=${FIRESTORE_EMULATOR_HOST:127.0.0.1:8081}
gcp.storage.bucket=${STORAGE_BUCKET:bachat-gat-development-docs-2026}

# Firebase web client configuration is supplied by Cloud Run environment variables.
# The web API key is a client identifier, not a server secret, but it must not be committed to Git.
firebase.web.api-key=${FIREBASE_WEB_API_KEY:}
firebase.web.auth-domain=${FIREBASE_WEB_AUTH_DOMAIN:bachat-gat-development.firebaseapp.com}
firebase.web.project-id=${FIREBASE_WEB_PROJECT_ID:bachat-gat-development}
firebase.web.storage-bucket=${FIREBASE_WEB_STORAGE_BUCKET:bachat-gat-development.firebasestorage.app}
firebase.web.messaging-sender-id=${FIREBASE_WEB_MESSAGING_SENDER_ID:230889435212}
firebase.web.app-id=${FIREBASE_WEB_APP_ID:1:230889435212:web:4772eab09363619ab104e9}

# JWT Authentication Configuration
# Supply JWT_SECRET through the environment or Secret Manager; never commit it.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.issuer=${JWT_ISSUER:bachatgat-api}

# Never use '*' for authenticated production browser requests.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Empty by default. Set only temporarily for the one-time production admin bootstrap.
app.bootstrap.admin-token=${BOOTSTRAP_ADMIN_TOKEN:}
# Set only temporarily to recover the existing superadmin password, then remove it.
app.admin.password-reset-token=${ADMIN_PASSWORD_RESET_TOKEN:}

# Actuator & Cloud Monitoring endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration (Cloud Logging format friendly)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.bachatgat=INFO
logging.level.org.springframework.security=WARN

# Report delivery. Keep credentials in Secret Manager/environment variables; never commit them.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
report.delivery.email.from=${REPORT_EMAIL_FROM:}
# OTP mail uses the verified report sender when supplied; otherwise use the
# SMTP login so a missing optional REPORT_EMAIL_FROM cannot create an empty
# From header and make the SMTP provider reject the message.
app.mail.from=${REPORT_EMAIL_FROM:${SMTP_USERNAME:localhost@bachatgat.local}}

# WhatsApp Cloud API document delivery. The access token must be supplied by Secret Manager.
report.delivery.whatsapp.enabled=${WHATSAPP_REPORTS_ENABLED:false}
report.delivery.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v22.0}
report.delivery.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
report.delivery.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
report.delivery.whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}

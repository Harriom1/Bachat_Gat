# Dev Environment Configuration
# Local development can start without manually exporting JWT_SECRET. Production
# still uses application-prod.properties, which requires the environment secret.
jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-2026}
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:true}
logging.level.com.bachatgat=DEBUG
logging.level.org.springframework.web=INFO

# Local OTP email delivery. Mailpit listens on SMTP 1025 and UI 8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:localhost@bachatgat.local}
app.firebase.auth.enabled=${FIREBASE_AUTH_ENABLED:false}

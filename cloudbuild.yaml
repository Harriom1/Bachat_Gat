# ==============================================================================
# Google Cloud Build CI/CD Pipeline
# Automates: Build and containerize -> Artifact Registry -> Cloud Run
# ==============================================================================

steps:
  # Build the JAR once in Docker's Maven stage. Run integration tests locally
  # against the emulator before submission, never against production Firestore.
  # Build the image with the Cloud Build ID and latest tags.
  # BUILD_ID is available for manual `gcloud builds submit` runs; COMMIT_SHA is
  # only populated for source-repository-triggered builds.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$BUILD_ID'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:latest'
      - '.'
    id: 'docker-build'

  # 3. Push container image to Google Cloud Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$BUILD_ID'
    id: 'docker-push-commit-tag'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:latest'
    id: 'docker-push-latest-tag'

  # 4. Deploy to Google Cloud Run with zero-downtime revision rollout
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bachatgat-service'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$BUILD_ID'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=^|^GCP_PROJECT_ID=$PROJECT_ID|SPRING_PROFILES_ACTIVE=prod|APP_DEMO_DATA_ENABLED=false|STORAGE_BUCKET=bachat-gat-development-docs-2026|CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}|FIREBASE_AUTH_ENABLED=true|FIREBASE_WEB_AUTH_DOMAIN=bachat-gat-development.firebaseapp.com|FIREBASE_WEB_PROJECT_ID=bachat-gat-development|FIREBASE_WEB_STORAGE_BUCKET=bachat-gat-development.firebasestorage.app|FIREBASE_WEB_MESSAGING_SENDER_ID=230889435212|FIREBASE_WEB_APP_ID=1:230889435212:web:4772eab09363619ab104e9|SMTP_HOST=smtp-relay.brevo.com|SMTP_PORT=587|SMTP_AUTH=true|SMTP_STARTTLS=true|JWT_EXPIRATION_MS=3600000|REPORT_EMAIL_FROM=${_REPORT_EMAIL_FROM}|FIREBASE_WEB_API_KEY=${_FIREBASE_WEB_API_KEY}'
      - '--set-secrets=JWT_SECRET=bachatgat-jwt-secret:latest,PAYMENT_HMAC_SECRET=bachatgat-payment-hmac-secret:latest,SMTP_USERNAME=bachatgat-smtp-username:latest,SMTP_PASSWORD=brevo-smtp-password:latest'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=40'
      - '--timeout=60s'
    id: 'cloud-run-deploy'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$BUILD_ID'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:latest'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # Include each exact HTTPS origin that users can sign in from.
  _CORS_ALLOWED_ORIGINS: 'https://bachatgat-service-230889435212.asia-south1.run.app,https://bachatgat-service-oeli5pcj2a-el.a.run.app'
  # Set these at build submission time; do not commit the actual values.
  # Replace these two empty defaults at build submission time, for example:
  # gcloud builds submit --substitutions=_REPORT_EMAIL_FROM=you@example.com,_FIREBASE_WEB_API_KEY=AIza...
  _REPORT_EMAIL_FROM: ''
  _FIREBASE_WEB_API_KEY: ''

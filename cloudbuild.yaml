# ==============================================================================
# Google Cloud Build CI/CD Pipeline
# Automates: Build -> Test -> Containerize -> Artifact Registry -> Cloud Run
# ==============================================================================

steps:
  # 1. Run Maven Build & Unit/Integration Tests
  - name: 'maven:3.9.9-eclipse-temurin-21-alpine'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-B']
    id: 'maven-build-and-test'

  # 2. Build Docker container image with Git commit SHA and latest tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:latest'
      - '.'
    id: 'docker-build'

  # 3. Push container image to Google Cloud Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$COMMIT_SHA'
    id: 'docker-push-commit-tag'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:latest'
    id: 'docker-push-latest-tag'

  # 4. Deploy to Google Cloud Run with zero-downtime revision rollout
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bachatgat-service'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,SPRING_PROFILES_ACTIVE=prod'
      - '--set-secrets=JWT_SECRET=bachatgat-jwt-secret:latest'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=40'
      - '--timeout=60s'
    id: 'cloud-run-deploy'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/bachatgat-app/bachatgat-shg-manager:latest'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY

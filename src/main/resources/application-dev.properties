# Dev Environment Configuration
# Local development can start without manually exporting JWT_SECRET. Production
# still uses application-prod.properties, which requires the environment secret.
jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-2026}
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:true}
logging.level.com.bachatgat=DEBUG
logging.level.org.springframework.web=INFO
